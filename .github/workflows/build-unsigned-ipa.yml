name: Build unsigned IPA

# Builds VLC Reloaded for a real device WITHOUT code signing and packages it as
# an .ipa you can download from the run's "Artifacts" section.
# Sign it yourself afterwards (Sideloadly, AltStore, TrollStore, `zsign`, ...).

on:
  workflow_dispatch:      # "Run workflow" button in the Actions tab
  push:
    branches: [master]
    tags: ['v*']

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      SCHEME: VLC-iOS-no-watch   # no Apple Watch app => nothing needs signing

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ hashFiles('Podfile.lock') }}

      - name: Install CocoaPods dependencies
        run: |
          gem install cocoapods --no-document
          pod install

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace VLC.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log | tail -n 40

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry VLC-Reloaded-unsigned.ipa Payload
          ls -lh VLC-Reloaded-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VLC-Reloaded-unsigned-ipa
          path: VLC-Reloaded-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VLC-Reloaded-unsigned.ipa
